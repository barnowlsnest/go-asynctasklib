<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Linear: Delay(attempt) = baseDelay × (attempt + 1)</text>
  <text x="16" y="42" fill="#94a3b8">baseDelay = 100ms</text>
  <line x1="90" y1="140" x2="440" y2="140" stroke="#334155"/>
  <g fill="#60a5fa">
    <rect x="100" y="140" width="44" height="0"><animate attributeName="height" values="0;0;18;18;0" keyTimes="0;0.05;0.12;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="140;140;122;122;140" keyTimes="0;0.05;0.12;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="170" y="140" width="44" height="0"><animate attributeName="height" values="0;0;36;36;0" keyTimes="0;0.2;0.27;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="140;140;104;104;140" keyTimes="0;0.2;0.27;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="240" y="140" width="44" height="0"><animate attributeName="height" values="0;0;54;54;0" keyTimes="0;0.35;0.42;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="140;140;86;86;140" keyTimes="0;0.35;0.42;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="310" y="140" width="44" height="0"><animate attributeName="height" values="0;0;72;72;0" keyTimes="0;0.5;0.57;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="140;140;68;68;140" keyTimes="0;0.5;0.57;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="380" y="140" width="44" height="0"><animate attributeName="height" values="0;0;90;90;0" keyTimes="0;0.65;0.72;0.95;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="140;140;50;50;140" keyTimes="0;0.65;0.72;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
  </g>
  <g fill="#e2e8f0" text-anchor="middle">
    <text x="122" y="116" opacity="0">100ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.14;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="192" y="98" opacity="0">200ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.29;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="262" y="80" opacity="0">300ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.44;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="332" y="62" opacity="0">400ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.57;0.59;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="402" y="44" opacity="0">500ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.74;0.95;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <g fill="#94a3b8" text-anchor="middle" font-size="10">
    <text x="122" y="153">attempt 0</text><text x="192" y="153">1</text><text x="262" y="153">2</text><text x="332" y="153">3</text><text x="402" y="153">4</text>
  </g>
  <text x="460" y="96" fill="#94a3b8">+100ms</text>
  <text x="460" y="110" fill="#94a3b8">each step</text>
</svg>
