    <rect x="30" y="80" width="110" height="26" rx="6" fill="#1e293b" stroke="#60a5fa"/>
    <text x="85" y="97">goroutine B</text>
    <rect x="30" y="120" width="110" height="26" rx="6" fill="#1e293b" stroke="#60a5fa"/>
    <text x="85" y="137">goroutine C</text>
  </g>
  <g stroke="#334155" stroke-width="2">
    <line x1="140" y1="53" x2="330" y2="93"/>
    <line x1="140" y1="93" x2="330" y2="93"/>
    <line x1="140" y1="133" x2="330" y2="93"/>
  </g>
  <rect x="330" y="60" width="200" height="66" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="2">
