<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Thread-safe: concurrent readers and writers go through atomics</text>
  <g font-weight="700" text-anchor="middle" fill="#e2e8f0">
    <rect x="30" y="40" width="110" height="26" rx="6" fill="#1e293b" stroke="#60a5fa"/>
