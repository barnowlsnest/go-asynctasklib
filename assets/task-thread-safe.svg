  <circle r="5" fill="#c084fc"><animateMotion dur="3s" repeatCount="indefinite" begin="0.9s" path="M140 93 L330 93" keyTimes="0;0.2;1" keyPoints="0;1;1"/></circle>
  <circle r="5" fill="#f472b6"><animateMotion dur="3s" repeatCount="indefinite" begin="1.8s" path="M140 133 L330 93" keyTimes="0;0.2;1" keyPoints="0;1;1"/></circle>
  <text x="235" y="150" text-anchor="middle" fill="#94a3b8">Load / Store / CompareAndSwap</text>
