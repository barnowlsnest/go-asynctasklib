<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Generic yielder: one-shot Yielder[T] sends values to Results()</text>
  <rect x="30" y="60" width="130" height="50" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="95" y="82" text-anchor="middle" fill="#e2e8f0" font-weight="700">Yielder[int]</text>
  <text x="95" y="98" text-anchor="middle" fill="#94a3b8">generate()</text>
  <rect x="160" y="76" width="240" height="18" fill="#1e293b" stroke="#334155"/>
  <text x="280" y="70" text-anchor="middle" fill="#94a3b8">chan T (Results)</text>
  <rect x="400" y="60" width="130" height="50" rx="8" fill="#1e293b" stroke="#4ade80"/>
  <text x="465" y="82" text-anchor="middle" fill="#e2e8f0" font-weight="700">for v := range</text>
  <text x="465" y="98" text-anchor="middle" fill="#94a3b8">y.Results()</text>
  <g font-weight="700" text-anchor="middle">
    <g><animateTransform attributeName="transform" type="translate" values="170,85;170,85;390,85;390,85" keyTimes="0;0.05;0.25;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.25;0.27;1" dur="6s" repeatCount="indefinite"/>
      <circle r="8" fill="#60a5fa"/><text y="4" fill="#0f172a">1</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="170,85;170,85;390,85;390,85" keyTimes="0;0.2;0.4;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.4;0.42;1" dur="6s" repeatCount="indefinite"/>
      <circle r="8" fill="#60a5fa"/><text y="4" fill="#0f172a">2</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="170,85;170,85;390,85;390,85" keyTimes="0;0.35;0.55;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.35;0.55;0.57;1" dur="6s" repeatCount="indefinite"/>
      <circle r="8" fill="#60a5fa"/><text y="4" fill="#0f172a">3</text></g>
  </g>
  <g fill="#94a3b8">
    <text x="410" y="130" opacity="0">got 1 2 3<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.58;0.95;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.65;0.95;1" dur="6s" repeatCount="indefinite"/>
    <line x1="400" y1="72" x2="400" y2="98" stroke="#f87171" stroke-width="3"/>
    <text x="280" y="120" text-anchor="middle" fill="#f87171">close(chan) · Done() closed: one shot, never restarts</text>
  </g>
</svg>
