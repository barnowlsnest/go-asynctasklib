<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Semaphore: NewSemaphore(3), a buffered channel used as permits</text>
  <text x="300" y="46" fill="#94a3b8">permits (Limit = 3)</text>
  <g fill="#1e293b" stroke="#334155" stroke-dasharray="4 3">
    <rect x="300" y="54" width="60" height="36" rx="6"/><rect x="370" y="54" width="60" height="36" rx="6"/><rect x="440" y="54" width="60" height="36" rx="6"/>
  </g>
  <g font-weight="700" text-anchor="middle">
