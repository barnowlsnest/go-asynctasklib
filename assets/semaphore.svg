      <rect width="50" height="28" rx="5" fill="#60a5fa"/><text x="25" y="18" fill="#0f172a">g1</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,40;40,40;375,58;375,58;40,40" keyTimes="0;0.1;0.17;0.98;1" dur="8s" repeatCount="indefinite"/>
      <rect width="50" height="28" rx="5" fill="#60a5fa"/><text x="25" y="18" fill="#0f172a">g2</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,40;40,40;445,58;445,58;40,40" keyTimes="0;0.17;0.24;0.98;1" dur="8s" repeatCount="indefinite"/>
      <rect width="50" height="28" rx="5" fill="#60a5fa"/><text x="25" y="18" fill="#0f172a">g3</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,40;40,40;220,58;220,58;305,58;305,58;40,40" keyTimes="0;0.26;0.32;0.56;0.62;0.98;1" dur="8s" repeatCount="indefinite"/>
      <rect width="50" height="28" rx="5" fill="#fbbf24"><animate attributeName="opacity" values="1;1;0.5;1;0.5;1;1" keyTimes="0;0.32;0.38;0.44;0.5;0.56;1" dur="8s" repeatCount="indefinite"/></rect>
      <text x="25" y="18" fill="#0f172a">g4</text></g>
