  </g>
  <text x="120" y="78" fill="#fbbf24" opacity="0">Acquire() blocks<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.55;0.57;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="280" y="128" fill="#f87171" opacity="0">TryAcquire() → false<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.41;0.42;0.5;0.52;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="380" y="110" fill="#4ade80" opacity="0">g1 Release() → g4 gets the permit<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="16" y="150" fill="#94a3b8">also AcquireWithContext(ctx) and TryAcquireWithTimeout(d) · Available() / Acquired()</text>
