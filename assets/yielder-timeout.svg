<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Timeout protection: a hard deadline counted from New()</text>
  <text x="30" y="56" fill="#94a3b8">WithTimeout(1s)</text>
  <rect x="150" y="46" width="300" height="12" rx="6" fill="#1e293b"/>
  <rect x="150" y="46" width="0" height="12" rx="6" fill="#fbbf24">
    <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.6;0.95;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#f87171;#f87171" keyTimes="0;0.59;0.6;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <line x1="150" y1="40" x2="150" y2="120" stroke="#60a5fa" stroke-dasharray="3 3"/>
  <text x="150" y="134" text-anchor="middle" fill="#60a5fa">New()</text>
  <line x1="450" y1="40" x2="450" y2="120" stroke="#f87171" stroke-dasharray="3 3"/>
  <text x="450" y="134" text-anchor="middle" fill="#f87171">deadline</text>
  <text x="30" y="96" fill="#94a3b8">values emitted</text>
  <line x1="150" y1="92" x2="530" y2="92" stroke="#334155"/>
  <g fill="#4ade80">
    <circle cx="210" cy="92" r="6" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.13;0.95;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="92" r="6" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.36;0.37;0.95;1" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <circle cx="500" cy="92" r="6" fill="none" stroke="#475569" stroke-dasharray="2 2"/>
  <text x="500" y="112" text-anchor="middle" fill="#475569">too late</text>
  <text x="300" y="152" text-anchor="middle" fill="#f87171" opacity="0">emits do not reset the deadline · stopped → Err() = ErrStopped
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.63;0.95;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>
