  <line x1="285" y1="100" x2="285" y2="140" stroke="#f87171" stroke-width="3" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7;0.71;0.95;1" dur="6s" repeatCount="indefinite"/></line>
  <text x="300" y="126" fill="#f87171" opacity="0">✗ compile error: cannot use string as Order
