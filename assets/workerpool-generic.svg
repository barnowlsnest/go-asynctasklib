  <text x="415" y="92" text-anchor="middle" fill="#94a3b8">handler(JobAware[Order])</text>
  <g font-weight="700" text-anchor="middle">
    <g><animateTransform attributeName="transform" type="translate" values="20,60;20,60;230,68;230,68;20,60" keyTimes="0;0.05;0.25;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.26;0.98;1" dur="6s" repeatCount="indefinite"/>
      <rect width="80" height="22" rx="4" fill="#4ade80"/><text x="40" y="15" fill="#0f172a">Order{1}</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="20,60;20,60;230,68;230,68;20,60" keyTimes="0;0.3;0.5;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.3;0.49;0.51;1" dur="6s" repeatCount="indefinite"/>
      <rect width="80" height="22" rx="4" fill="#4ade80"/><text x="40" y="15" fill="#0f172a">Order{2}</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="20,110;20,110;190,110;190,110;20,110" keyTimes="0;0.55;0.7;0.95;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.54;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
