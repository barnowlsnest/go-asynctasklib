<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Panic recovery: a panicking generator becomes an Err(), not a crash</text>
  <rect x="30" y="60" width="150" height="50" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="105" y="82" text-anchor="middle" fill="#e2e8f0" font-weight="700">generator fn</text>
  <text x="105" y="98" text-anchor="middle" fill="#94a3b8">panic("oops")</text>
  <text x="105" y="52" text-anchor="middle" font-size="20" opacity="0">💥<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.1;0.14;0.3;1" dur="5s" repeatCount="indefinite"/></text>
  <rect x="210" y="60" width="140" height="50" rx="8" fill="#1e293b" stroke="#fbbf24">
    <animate attributeName="stroke-width" values="1;1;3;1;1" keyTimes="0;0.25;0.32;0.4;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="280" y="82" text-anchor="middle" fill="#e2e8f0" font-weight="700">defer recover()</text>
  <text x="280" y="98" text-anchor="middle" fill="#94a3b8">setErr + close(chan)</text>
  <rect x="380" y="60" width="150" height="50" rx="8" fill="#1e293b" stroke="#4ade80"/>
  <text x="455" y="82" text-anchor="middle" fill="#e2e8f0" font-weight="700">y.Err()</text>
  <text x="455" y="98" text-anchor="middle" fill="#f87171" opacity="0">panic in generator func<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.63;0.95;1" dur="5s" repeatCount="indefinite"/></text>
  <g>
    <circle r="7" fill="#f87171"/>
    <animateMotion dur="5s" repeatCount="indefinite" path="M180 85 H380" keyTimes="0;0.14;0.3;0.38;0.6;1" keyPoints="0;0;0.5;0.5;1;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.13;0.14;0.6;0.62;1" dur="5s" repeatCount="indefinite"/>
  </g>
  <text x="280" y="140" text-anchor="middle" fill="#4ade80" opacity="0">Results() closes cleanly, so range loops exit and nothing leaks
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.68;0.95;1" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
