<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Rate limiting: a token bucket paces Submit into the backlog</text>
  <path d="M220 50 V110 Q220 120 230 120 H310 Q320 120 320 110 V50" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" fill="#94a3b8">rate.Limiter (burst 3)</text>
  <g fill="#fbbf24">
    <circle cx="245" cy="105" r="8"><animate attributeName="opacity" values="1;1;0;0;1;1;0;0;1" keyTimes="0;0.12;0.13;0.47;0.48;0.52;0.53;0.96;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="270" cy="105" r="8"><animate attributeName="opacity" values="1;1;0;0;1;1;0;0;1" keyTimes="0;0.17;0.18;0.67;0.68;0.72;0.73;0.96;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="295" cy="105" r="8"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.22;0.23;0.96;1" dur="8s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="420" y="62" width="110" height="40" rx="8" fill="#1e293b" stroke="#60a5fa"/>
  <text x="475" y="86" text-anchor="middle" fill="#e2e8f0">backlog</text>
  <g font-weight="700" text-anchor="middle" font-size="10">
    <g><animateTransform attributeName="transform" type="translate" values="40,82;40,82;420,82;420,82" keyTimes="0;0.05;0.2;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.2;0.21;1" dur="8s" repeatCount="indefinite"/><circle r="8" fill="#60a5fa"/><text y="3" fill="#0f172a">1</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,82;40,82;420,82;420,82" keyTimes="0;0.1;0.25;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.09;0.1;0.25;0.26;1" dur="8s" repeatCount="indefinite"/><circle r="8" fill="#60a5fa"/><text y="3" fill="#0f172a">2</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,82;40,82;420,82;420,82" keyTimes="0;0.15;0.3;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.14;0.15;0.3;0.31;1" dur="8s" repeatCount="indefinite"/><circle r="8" fill="#60a5fa"/><text y="3" fill="#0f172a">3</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,82;40,82;190,82;190,82;420,82;420,82" keyTimes="0;0.2;0.27;0.5;0.6;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.2;0.6;0.61;1" dur="8s" repeatCount="indefinite"/><circle r="8" fill="#94a3b8"/><text y="3" fill="#0f172a">4</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,82;40,82;165,82;165,82;420,82;420,82" keyTimes="0;0.25;0.32;0.7;0.8;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.8;0.81;1" dur="8s" repeatCount="indefinite"/><circle r="8" fill="#94a3b8"/><text y="3" fill="#0f172a">5</text></g>
  </g>
  <text x="40" y="60" fill="#94a3b8" opacity="0">limiter.Wait(): blocks until a token refills<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.75;0.8;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="330" y="50" fill="#94a3b8" font-size="10">refill at RateLimit/s</text>
</svg>
