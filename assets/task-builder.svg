<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Builder pattern: chain options, then Build() validates them</text>
  <text x="30" y="52" fill="#e2e8f0">task.NewBuilder(</text>
  <g fill="#60a5fa">
    <text x="50" y="70" opacity="0">WithID(1),<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.08;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="50" y="86" opacity="0">WithTaskFn(fn),<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.18;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="50" y="102" opacity="0">WithMaxRetries(3),<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.28;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="50" y="118" opacity="0">WithTimeout(5*time.Second),<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.38;0.95;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <text x="30" y="136" fill="#e2e8f0">).Build()</text>
  <line x1="260" y1="90" x2="300" y2="90" stroke="#334155" stroke-width="2"/>
  <rect x="300" y="44" width="110" height="96" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="355" y="60" text-anchor="middle" fill="#c084fc" font-weight="700">validate</text>
  <g fill="#4ade80">
    <text x="312" y="80" opacity="0">✓ ID &gt; 0<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="312" y="98" opacity="0">✓ TaskFn set<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.57;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="312" y="116" opacity="0">✓ retries ok<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.64;0.95;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <line x1="410" y1="90" x2="430" y2="90" stroke="#334155" stroke-width="2"/>
  <g opacity="0">
    <rect x="430" y="66" width="110" height="48" rx="8" fill="#4ade80"/>
    <text x="485" y="88" text-anchor="middle" fill="#0f172a" font-weight="700">*Definition</text>
    <text x="485" y="104" text-anchor="middle" fill="#0f172a">nil error</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.75;0.95;1" dur="6s" repeatCount="indefinite"/>
  </g>
  <text x="430" y="132" fill="#94a3b8" font-size="10">a missing field returns</text>
  <text x="430" y="146" fill="#94a3b8" font-size="10">ErrTaskFnNotSet etc.</text>
</svg>
