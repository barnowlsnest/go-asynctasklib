<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Constant delay: Definition.RetryDelay, no strategy needed</text>
  <text x="16" y="42" fill="#94a3b8">WithRetryDelay(200ms): every gap is the same</text>
  <line x1="30" y1="100" x2="530" y2="100" stroke="#334155"/>
  <g fill="#60a5fa">
    <rect x="40" y="86" width="60" height="28" rx="5"/>
    <rect x="160" y="86" width="60" height="28" rx="5"/>
    <rect x="280" y="86" width="60" height="28" rx="5"/>
    <rect x="400" y="86" width="60" height="28" rx="5"/>
  </g>
  <g fill="#0f172a" font-weight="700" text-anchor="middle">
    <text x="70" y="104">try</text><text x="190" y="104">try</text><text x="310" y="104">try</text><text x="430" y="104">try</text>
  </g>
  <g stroke="#fbbf24" stroke-width="3">
    <line x1="100" y1="72" x2="100" y2="72"><animate attributeName="x2" values="100;100;160;160;100" keyTimes="0;0.05;0.25;0.95;1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="220" y1="72" x2="220" y2="72"><animate attributeName="x2" values="220;220;280;280;220" keyTimes="0;0.3;0.5;0.95;1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="340" y1="72" x2="340" y2="72"><animate attributeName="x2" values="340;340;400;400;340" keyTimes="0;0.55;0.75;0.95;1" dur="6s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#fbbf24" text-anchor="middle">
    <text x="130" y="64" opacity="0">200ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="250" y="64" opacity="0">200ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.95;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="370" y="64" opacity="0">200ms<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.95;1" dur="6s" repeatCount="indefinite"/></text>
  </g>
  <text x="30" y="140" fill="#94a3b8">set a RetryStrategy only when the delay has to grow</text>
</svg>
