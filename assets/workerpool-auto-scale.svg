<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <defs>
    <clipPath id="reveal"><rect x="0" y="0" width="0" height="160"><animate attributeName="width" values="0;0;530;530;0" keyTimes="0;0.03;0.8;0.97;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Auto-scaling pool: scale up fast under backlog, down slow when idle</text>
  <line x1="60" y1="55" x2="520" y2="55" stroke="#f87171" stroke-dasharray="4 3"/>
  <text x="56" y="59" text-anchor="end" fill="#f87171">Max</text>
  <line x1="60" y1="115" x2="520" y2="115" stroke="#4ade80" stroke-dasharray="4 3"/>
  <text x="56" y="119" text-anchor="end" fill="#4ade80">Min</text>
  <line x1="60" y1="135" x2="520" y2="135" stroke="#334155"/>
  <text x="520" y="150" text-anchor="end" fill="#94a3b8">time →</text>
  <g clip-path="url(#reveal)">
    <path d="M60 135 L120 135 L140 65 L230 65 L270 135 L520 135 Z" fill="#fbbf24" opacity="0.25"/>
    <path d="M60 115 H140 V85 H160 V55 H330 V70 H380 V85 H430 V100 H480 V115 H520" fill="none" stroke="#60a5fa" stroke-width="3"/>
  </g>
  <g font-size="10">
    <text x="300" y="45" fill="#94a3b8"><tspan fill="#60a5fa">━</tspan> workers  <tspan fill="#fbbf24">■</tspan> backlog</text>
    <text x="150" y="150" fill="#60a5fa" opacity="0">+ScaleUpStep per tick<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.28;0.95;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="345" y="106" fill="#60a5fa" opacity="0">−1 per ScaleDownCooldown<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.58;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
</svg>
