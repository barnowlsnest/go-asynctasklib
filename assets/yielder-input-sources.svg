<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Three input sources, one Results() channel</text>
  <g font-weight="700" text-anchor="middle">
    <rect x="20" y="40" width="190" height="26" rx="5" fill="#1e293b" stroke="#60a5fa">
      <animate attributeName="stroke-width" values="3;3;1;1;1;3" keyTimes="0;0.3;0.33;0.96;0.99;1" dur="9s" repeatCount="indefinite"/></rect>
    <text x="115" y="57" fill="#e2e8f0">WithGeneratorFunc(fn)</text>
    <rect x="20" y="76" width="190" height="26" rx="5" fill="#1e293b" stroke="#4ade80">
      <animate attributeName="stroke-width" values="1;1;3;3;1;1" keyTimes="0;0.33;0.34;0.63;0.66;1" dur="9s" repeatCount="indefinite"/></rect>
    <text x="115" y="93" fill="#e2e8f0">WithValues([]T)</text>
    <rect x="20" y="112" width="190" height="26" rx="5" fill="#1e293b" stroke="#fbbf24">
      <animate attributeName="stroke-width" values="1;1;3;3" keyTimes="0;0.66;0.67;1" dur="9s" repeatCount="indefinite"/></rect>
    <text x="115" y="129" fill="#e2e8f0">WithInputChannel(ch)</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M210 53 C250 53, 250 89, 280 89"/>
    <path d="M210 89 H280"/>
    <path d="M210 125 C250 125, 250 89, 280 89"/>
  </g>
  <rect x="280" y="66" width="110" height="46" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="335" y="93" text-anchor="middle" fill="#e2e8f0" font-weight="700">Yielder[T]</text>
  <line x1="390" y1="89" x2="530" y2="89" stroke="#334155" stroke-width="2"/>
  <text x="460" y="80" text-anchor="middle" fill="#94a3b8">Results()</text>
  <circle r="6" fill="#60a5fa"><animateMotion dur="3s" repeatCount="indefinite" path="M210 53 C250 53, 250 89, 280 89 M390 89 H530"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.33;0.333;0.999;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle r="6" fill="#4ade80" opacity="0"><animateMotion dur="3s" repeatCount="indefinite" path="M210 89 H280 M390 89 H530"/>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.333;0.666" dur="9s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <circle r="6" fill="#fbbf24" opacity="0"><animateMotion dur="3s" repeatCount="indefinite" path="M210 125 C250 125, 250 89, 280 89 M390 89 H530"/>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.666" dur="9s" repeatCount="indefinite" calcMode="discrete"/></circle>
  <text x="460" y="120" text-anchor="middle" fill="#94a3b8" font-size="10">the input channel streams</text>
  <text x="460" y="134" text-anchor="middle" fill="#94a3b8" font-size="10">until it closes or ctx ends</text>
</svg>
