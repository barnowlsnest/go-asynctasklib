<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Graceful error handling: a panic is recovered and returned as an error</text>
  <rect x="30" y="60" width="130" height="44" rx="8" fill="#1e293b" stroke="#60a5fa"/>
  <text x="95" y="80" text-anchor="middle" fill="#e2e8f0" font-weight="700">TaskFn(ctx)</text>
  <text x="95" y="96" text-anchor="middle" fill="#94a3b8">panic("boom")</text>
  <text x="95" y="52" text-anchor="middle" font-size="20" opacity="0">💥
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.1;0.15;0.3;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <rect x="215" y="60" width="130" height="44" rx="8" fill="#1e293b" stroke="#c084fc">
    <animate attributeName="stroke-width" values="1;1;3;1;1" keyTimes="0;0.3;0.38;0.46;1" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="280" y="80" text-anchor="middle" fill="#e2e8f0" font-weight="700">recover()</text>
  <text x="280" y="96" text-anchor="middle" fill="#94a3b8">"task panicked: …"</text>
  <rect x="400" y="60" width="130" height="44" rx="8" fill="#1e293b" stroke="#4ade80"/>
  <text x="465" y="80" text-anchor="middle" fill="#e2e8f0" font-weight="700">task.Err()</text>
  <text x="465" y="96" text-anchor="middle" fill="#94a3b8">state = failed</text>
  <g>
    <circle r="7" fill="#f87171"/>
    <animateMotion dur="5s" repeatCount="indefinite" path="M160 82 H400" keyTimes="0;0.15;0.35;0.4;0.65;1" keyPoints="0;0;0.23;0.23;1;1"/>
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.14;0.15;0.65;0.9;1" dur="5s" repeatCount="indefinite"/>
  </g>
  <text x="280" y="140" text-anchor="middle" fill="#4ade80" opacity="0">the process keeps running and the caller gets a structured error
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.7;0.92;1" dur="5s" repeatCount="indefinite"/>
  </text>
</svg>
