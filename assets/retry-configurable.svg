<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Configurable: functional options shape any strategy</text>
  <g font-weight="700" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,44;30,44;250,74;250,74;30,44" keyTimes="0;0.05;0.2;0.96;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.19;0.21;0.98;1" dur="6s" repeatCount="indefinite"/>
      <rect width="150" height="22" rx="4" fill="#60a5fa"/><text x="75" y="15" fill="#0f172a">WithBaseDelay(d)</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,78;30,78;250,74;250,74;30,78" keyTimes="0;0.2;0.35;0.96;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.34;0.36;0.98;1" dur="6s" repeatCount="indefinite"/>
      <rect width="150" height="22" rx="4" fill="#f87171"/><text x="75" y="15" fill="#0f172a">WithMaxDelay(d)</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,112;30,112;250,74;250,74;30,112" keyTimes="0;0.35;0.5;0.96;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.49;0.51;0.98;1" dur="6s" repeatCount="indefinite"/>
      <rect width="150" height="22" rx="4" fill="#4ade80"/><text x="75" y="15" fill="#0f172a">WithJitter(true)</text>
    </g>
  </g>
  <rect x="230" y="56" width="140" height="58" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="300" y="76" text-anchor="middle" fill="#e2e8f0" font-weight="700">NewLinear(...)</text>
  <text x="300" y="92" text-anchor="middle" fill="#94a3b8">NewExponential</text>
  <text x="300" y="106" text-anchor="middle" fill="#94a3b8">Backoff(...)</text>
  <line x1="370" y1="85" x2="400" y2="85" stroke="#334155" stroke-width="2"/>
  <rect x="400" y="62" width="140" height="46" rx="8" fill="#1e293b" stroke="#334155">
    <animate attributeName="stroke" values="#334155;#334155;#c084fc;#c084fc;#334155" keyTimes="0;0.55;0.58;0.95;1" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="470" y="82" text-anchor="middle" fill="#e2e8f0">retry.Strategy</text>
  <text x="470" y="98" text-anchor="middle" fill="#c084fc" opacity="0">Delay(attempt)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.58;0.95;1" dur="6s" repeatCount="indefinite"/></text>
  <text x="230" y="142" fill="#94a3b8">defaults: baseDelay 100ms · maxDelay 30s · jitter off</text>
</svg>
