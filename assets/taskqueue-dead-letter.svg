<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Attempt tracking + DLQ: WithMaxAttempts(3), then into the DeadLetter</text>
  <rect x="20" y="60" width="100" height="44" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="70" y="86" text-anchor="middle" fill="#e2e8f0" font-weight="700">Queue</text>
  <rect x="250" y="60" width="110" height="44" rx="8" fill="#1e293b" stroke="#60a5fa"/>
  <text x="305" y="86" text-anchor="middle" fill="#e2e8f0">consumer</text>
  <rect x="420" y="60" width="120" height="44" rx="8" fill="#1e293b" stroke="#f87171"/>
  <text x="480" y="80" text-anchor="middle" fill="#f87171" font-weight="700">DeadLetter</text>
  <text x="480" y="96" text-anchor="middle" fill="#94a3b8" font-size="10">Redrive(id) to retry</text>
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="120,82;120,82;250,82;250,82;120,82;120,82;250,82;250,82;120,82;120,82;250,82;250,82;420,82;420,82"
      keyTimes="0;0.02;0.1;0.18;0.24;0.28;0.36;0.44;0.5;0.54;0.62;0.7;0.8;1" dur="8s" repeatCount="indefinite"/>
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="#fbbf24">
      <animate attributeName="fill" values="#fbbf24;#fbbf24;#f87171;#f87171" keyTimes="0;0.7;0.72;1" dur="8s" repeatCount="indefinite"/></rect>
    <text y="4" text-anchor="middle" fill="#0f172a" font-weight="700">T</text>
  </g>
  <g fill="#f87171" font-size="10" text-anchor="middle">
    <text x="305" y="120" opacity="0">Nack (attempt 1)<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.14;0.16;0.26;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="305" y="120" opacity="0">Nack (attempt 2)<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.4;0.42;0.52;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="305" y="120" opacity="0">Nack (attempt 3 = max)<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.66;0.68;0.8;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <g fill="#94a3b8" font-size="10">
    <text x="130" y="56" opacity="0">requeue<animate attributeName="opacity" values="0;0;1;0;0;1;0;0" keyTimes="0;0.18;0.2;0.26;0.44;0.46;0.52;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
  <text x="20" y="146" fill="#94a3b8">lease expiries count too: Nack and the reaper apply the same policy</text>
</svg>
