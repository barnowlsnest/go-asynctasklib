<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Panic recovery: the worker survives a panicking handler</text>
  <rect x="180" y="50" width="160" height="50" rx="8" fill="#1e293b" stroke="#60a5fa">
    <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#60a5fa;#60a5fa" keyTimes="0;0.2;0.25;0.4;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="260" y="72" text-anchor="middle" fill="#e2e8f0" font-weight="700">worker 1</text>
  <text x="260" y="90" text-anchor="middle" fill="#94a3b8">recover() in run loop</text>
  <text x="260" y="44" text-anchor="middle" font-size="18" opacity="0">💥<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2;0.23;0.35;1" dur="7s" repeatCount="indefinite"/></text>
  <g font-weight="700" text-anchor="middle">
    <g><animateTransform attributeName="transform" type="translate" values="40,75;40,75;180,75;180,75" keyTimes="0;0.05;0.2;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.05;0.2;0.22;1" dur="7s" repeatCount="indefinite"/>
      <circle r="9" fill="#f87171"/><text y="4" fill="#0f172a">1</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="40,75;40,75;180,75;180,75" keyTimes="0;0.5;0.65;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.65;0.67;1" dur="7s" repeatCount="indefinite"/>
      <circle r="9" fill="#4ade80"/><text y="4" fill="#0f172a">2</text></g>
  </g>
  <rect x="380" y="50" width="160" height="50" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="460" y="72" text-anchor="middle" fill="#c084fc" font-weight="700">PoolEvents</text>
  <text x="460" y="90" text-anchor="middle" fill="#f87171" opacity="0">JobFailed(ErrWorkerPanic)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.35;0.62;0.65;1" dur="7s" repeatCount="indefinite"/></text>
  <text x="460" y="90" text-anchor="middle" fill="#4ade80" opacity="0">JobOk(job 2)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.77;0.95;1" dur="7s" repeatCount="indefinite"/></text>
  <circle r="6" fill="#f87171" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" path="M340 75 H380" keyTimes="0;0.25;0.33;1" keyPoints="0;0;1;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.33;0.34;1" dur="7s" repeatCount="indefinite"/></circle>
  <text x="260" y="130" text-anchor="middle" fill="#94a3b8" opacity="0">same worker, next job<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.52;0.95;1" dur="7s" repeatCount="indefinite"/></text>
</svg>
