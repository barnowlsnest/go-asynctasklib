<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Graceful close: Close stops the reaper, and later calls are rejected</text>
  <rect x="20" y="50" width="200" height="34" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="40" y="71" fill="#e2e8f0">reaper</text>
  <circle cx="190" cy="67" r="9" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="14 42">
    <animateTransform attributeName="transform" type="rotate" values="0 190 67;360 190 67" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="stroke" values="#4ade80;#4ade80;#475569;#475569" keyTimes="0;0.3;0.31;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="71" fill="#475569" opacity="0">stopped<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.32;0.95;1" dur="7s" repeatCount="indefinite"/></text>
  <g font-weight="700">
    <text x="260" y="60" fill="#f87171" opacity="0">q.Close(ctx) → nil<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.95;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="260" y="80" fill="#94a3b8" opacity="0">waits for the reaper to exit<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.32;0.95;1" dur="7s" repeatCount="indefinite"/></text>
  </g>
  <g>
    <text x="20" y="114" fill="#60a5fa" opacity="0">q.Enqueue(ctx, t)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.47;0.95;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="200" y="114" fill="#f87171" opacity="0">✗ ErrQueueClosed<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.54;0.95;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="20" y="134" fill="#60a5fa" opacity="0">q.Dequeue(ctx, d)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.6;0.95;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="200" y="134" fill="#f87171" opacity="0">✗ ErrQueueClosed<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.66;0.95;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="20" y="154" fill="#c084fc" opacity="0">q.Close(ctx) again<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.72;0.74;0.95;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="200" y="154" fill="#4ade80" opacity="0">✓ no-op (idempotent)<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.8;0.95;1" dur="7s" repeatCount="indefinite"/></text>
  </g>
</svg>
