<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Fixed-size pool: ModeFixedSize, all workers subscribed in New()</text>
  <rect x="30" y="66" width="110" height="40" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="85" y="90" text-anchor="middle" fill="#e2e8f0" font-weight="700">Submit(job)</text>
  <g fill="#1e293b" stroke="#60a5fa">
    <rect x="400" y="36" width="130" height="22" rx="5"/><rect x="400" y="64" width="130" height="22" rx="5"/>
    <rect x="400" y="92" width="130" height="22" rx="5"/><rect x="400" y="120" width="130" height="22" rx="5"/>
  </g>
  <g fill="#e2e8f0" text-anchor="middle"><text x="465" y="51">worker 1</text><text x="465" y="79">worker 2</text><text x="465" y="107">worker 3</text><text x="465" y="135">worker 4</text></g>
  <g fill="#fbbf24">
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0s" path="M140 86 C270 86, 270 47, 400 47"/></circle>
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s" path="M140 86 C270 86, 270 75, 400 75"/></circle>
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s" path="M140 86 C270 86, 270 103, 400 103"/></circle>
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s" path="M140 86 C270 86, 270 131, 400 131"/></circle>
  </g>
  <text x="30" y="140" fill="#94a3b8">Size = 4, fixed for the pool's lifetime</text>
</svg>
