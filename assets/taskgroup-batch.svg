<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Batch operations: SubmitBatch(ctx, defs) returns []*task.Task</text>
  <text x="30" y="48" fill="#94a3b8">[]task.Definition</text>
  <text x="430" y="48" fill="#94a3b8">[]*task.Task</text>
  <rect x="215" y="62" width="130" height="50" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="280" y="84" text-anchor="middle" fill="#e2e8f0" font-weight="700">SubmitBatch</text>
  <text x="280" y="100" text-anchor="middle" fill="#94a3b8">Submit each def</text>
  <g font-weight="700" text-anchor="middle">
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,56;30,56;260,72;430,56;430,56;30,56" keyTimes="0;0.05;0.15;0.25;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect width="80" height="20" rx="4" fill="#60a5fa"><animate attributeName="fill" values="#60a5fa;#60a5fa;#fbbf24;#fbbf24" keyTimes="0;0.15;0.16;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="40" y="14" fill="#0f172a">def 1</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,80;30,80;260,72;430,80;430,80;30,80" keyTimes="0;0.2;0.3;0.4;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect width="80" height="20" rx="4" fill="#60a5fa"><animate attributeName="fill" values="#60a5fa;#60a5fa;#fbbf24;#fbbf24" keyTimes="0;0.3;0.31;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="40" y="14" fill="#0f172a">def 2</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,104;30,104;260,72;430,104;430,104;30,104" keyTimes="0;0.35;0.45;0.55;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect width="80" height="20" rx="4" fill="#60a5fa"><animate attributeName="fill" values="#60a5fa;#60a5fa;#fbbf24;#fbbf24" keyTimes="0;0.45;0.46;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="40" y="14" fill="#0f172a">def 3</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="30,128;30,128;260,72;430,128;430,128;30,128" keyTimes="0;0.5;0.6;0.7;0.95;1" dur="6s" repeatCount="indefinite"/>
      <rect width="80" height="20" rx="4" fill="#60a5fa"><animate attributeName="fill" values="#60a5fa;#60a5fa;#fbbf24;#fbbf24" keyTimes="0;0.6;0.61;1" dur="6s" repeatCount="indefinite"/></rect>
      <text x="40" y="14" fill="#0f172a">def 4</text>
    </g>
  </g>
  <text x="280" y="140" text-anchor="middle" fill="#94a3b8">it stops at the first Submit error and returns the tasks started so far</text>
</svg>
