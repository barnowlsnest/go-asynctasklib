<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">At-least-once: an un-acked lease expires and the task is redelivered</text>
  <rect x="20" y="66" width="100" height="40" rx="8" fill="#1e293b" stroke="#c084fc"/>
  <text x="70" y="90" text-anchor="middle" fill="#e2e8f0" font-weight="700">Queue</text>
  <rect x="380" y="40" width="150" height="34" rx="8" fill="#1e293b" stroke="#60a5fa">
    <animate attributeName="stroke" values="#60a5fa;#60a5fa;#f87171;#f87171;#60a5fa" keyTimes="0;0.25;0.27;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
  <text x="455" y="61" text-anchor="middle" fill="#e2e8f0">consumer 1</text>
  <text x="540" y="61" fill="#f87171" font-weight="700" opacity="0" text-anchor="end">✗<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.27;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  <rect x="380" y="100" width="150" height="34" rx="8" fill="#1e293b" stroke="#60a5fa"/>
  <text x="455" y="121" text-anchor="middle" fill="#e2e8f0">consumer 2</text>
  <text x="170" y="58" fill="#94a3b8" font-size="10">visibility lease</text>
  <rect x="170" y="62" width="160" height="8" rx="4" fill="#1e293b"/>
  <rect x="170" y="62" width="0" height="8" rx="4" fill="#fbbf24">
    <animate attributeName="width" values="0;0;160;0;0" keyTimes="0;0.12;0.55;0.56;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#f87171;#f87171" keyTimes="0;0.5;0.55;1" dur="8s" repeatCount="indefinite"/></rect>
  <g fill="#fbbf24">
    <animateTransform attributeName="transform" type="translate" values="120,86;120,86;380,57;380,57;120,86;120,86;380,117;380,117" keyTimes="0;0.02;0.12;0.55;0.6;0.65;0.75;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#fbbf24;#fbbf24;#4ade80;#4ade80" keyTimes="0;0.8;0.82;1" dur="8s" repeatCount="indefinite"/>
    <rect x="-14" y="-10" width="28" height="20" rx="4" fill="inherit"/>
    <text y="4" text-anchor="middle" fill="#0f172a" font-weight="700">T</text>
  </g>
  <g fill="#94a3b8" font-size="10">
    <text x="170" y="100" opacity="0">Dequeue → Claim<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.02;0.05;0.2;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="170" y="100" fill="#f87171" opacity="0">crash before Ack: lease runs out<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.3;0.56;0.58;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="170" y="100" opacity="0">requeued (attempt 2)<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.58;0.6;0.7;0.72;1" dur="8s" repeatCount="indefinite"/></text>
    <text x="170" y="140" fill="#4ade80" opacity="0">claim.Ack(ctx) ✓<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  </g>
</svg>
