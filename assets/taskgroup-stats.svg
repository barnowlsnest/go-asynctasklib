<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Pool statistics: Stats() takes a live snapshot of states and workers</text>
  <g fill="#94a3b8" text-anchor="end">
    <text x="150" y="52">Started</text>
    <text x="150" y="74">Done</text>
    <text x="150" y="96">Failed</text>
    <text x="150" y="118">ActiveWorkers</text>
    <text x="150" y="140">AvailableWorkers</text>
  </g>
  <g fill="#1e293b">
    <rect x="160" y="43" width="320" height="12" rx="3"/>
    <rect x="160" y="65" width="320" height="12" rx="3"/>
    <rect x="160" y="87" width="320" height="12" rx="3"/>
    <rect x="160" y="109" width="320" height="12" rx="3"/>
    <rect x="160" y="131" width="320" height="12" rx="3"/>
  </g>
  <rect x="160" y="43" height="12" rx="3" fill="#fbbf24" width="0">
    <animate attributeName="width" values="0;240;160;160;80;0;0" keyTimes="0;0.15;0.35;0.5;0.7;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="65" height="12" rx="3" fill="#4ade80" width="0">
    <animate attributeName="width" values="0;0;80;80;160;240;240;0" keyTimes="0;0.15;0.35;0.5;0.7;0.85;0.95;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="87" height="12" rx="3" fill="#f87171" width="0">
    <animate attributeName="width" values="0;0;0;80;80;0" keyTimes="0;0.5;0.69;0.7;0.95;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="109" height="12" rx="3" fill="#60a5fa" width="0">
    <animate attributeName="width" values="0;240;160;160;80;0;0" keyTimes="0;0.15;0.35;0.5;0.7;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="160" y="131" height="12" rx="3" fill="#334155" width="320">
    <animate attributeName="width" values="320;80;160;160;240;320;320" keyTimes="0;0.15;0.35;0.5;0.7;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="490" y="118" fill="#94a3b8">of Max</text>
</svg>
