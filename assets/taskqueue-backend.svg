<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11">
  <rect width="560" height="160" rx="10" fill="#0f172a"/>
  <text x="16" y="24" font-size="12" font-weight="700" fill="#e2e8f0">Backend-agnostic: Queue talks to a Backend interface, not to storage</text>
  <rect x="20" y="62" width="110" height="44" rx="8" fill="#1e293b" stroke="#60a5fa"/>
  <text x="75" y="88" text-anchor="middle" fill="#e2e8f0" font-weight="700">Queue</text>
  <rect x="180" y="46" width="150" height="76" rx="8" fill="#1e293b" stroke="#c084fc" stroke-dasharray="5 3"/>
  <text x="255" y="64" text-anchor="middle" fill="#c084fc" font-weight="700">Backend</text>
  <g fill="#94a3b8" font-size="10" text-anchor="middle"><text x="255" y="80">Enqueue · Claim</text><text x="255" y="94">Ack · Nack</text><text x="255" y="108">ReapExpired · Len</text></g>
  <rect x="380" y="40" width="160" height="34" rx="8" fill="#1e293b" stroke="#4ade80">
    <animate attributeName="stroke-width" values="3;3;1;1;3" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="460" y="61" text-anchor="middle" fill="#e2e8f0">MemoryBackend (default)</text>
  <rect x="380" y="94" width="160" height="34" rx="8" fill="#1e293b" stroke="#fbbf24">
    <animate attributeName="stroke-width" values="1;1;3;3;1" keyTimes="0;0.5;0.52;0.98;1" dur="6s" repeatCount="indefinite"/></rect>
  <text x="460" y="110" text-anchor="middle" fill="#e2e8f0">PostgreSQL (yours)</text>
  <text x="460" y="122" text-anchor="middle" fill="#94a3b8" font-size="9">FOR UPDATE SKIP LOCKED</text>
  <line x1="130" y1="84" x2="180" y2="84" stroke="#334155" stroke-width="2"/>
  <path d="M330 84 L380 57" stroke="#334155" stroke-width="2"/>
  <path d="M330 84 L380 111" stroke="#334155" stroke-width="2"/>
  <circle r="6" fill="#4ade80"><animateMotion dur="3s" repeatCount="indefinite" path="M130 84 H330 L380 57"/>
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
  <circle r="6" fill="#fbbf24" opacity="0"><animateMotion dur="3s" repeatCount="indefinite" path="M130 84 H330 L380 111"/>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/></circle>
  <text x="20" y="148" fill="#94a3b8">swap it in with WithBackend(b): the Queue code does not change</text>
</svg>
